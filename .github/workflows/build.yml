name: Build OrangeFox Recovery - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf build-essential libssl-dev libxml2-utils xsltproc fontconfig \
          pngcrush imagemagick zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-dev readline-common libncurses5 \
          git flex bison python3 python-is-python3 repo ccache

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync Source from GitLab
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Force Git to use HTTPS for all GitLab submodules
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        
        # Clone official OrangeFox sync tool from GitLab
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git
        
        # Execute official sync script
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: 'fox_12.1/device/xiaomi/spinel'

    - name: Build Recovery Image
      run: |
        cd ~/fox_12.1
        source build/envsetup.sh
        lunch fox_spinel-eng
        mka recoveryimage -j$(nproc)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-spinel-Build
        path: |
          ~/fox_12.1/out/target/product/spinel/OrangeFox*.img
          ~/fox_12.1/out/target/product/spinel/OrangeFox*.zip
          ~/fox_12.1/out/target/product/spinel/recovery.img
